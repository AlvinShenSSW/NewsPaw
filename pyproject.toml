[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newspaw"
version = "0.6.4"
description = "A personal news agent for Telegram, running on your Mac."
readme = "README.md"
requires-python = ">=3.12.4"
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<0.29",
  "keyring>=25.7,<26; sys_platform == 'darwin'",
  "pillow>=12.2,<14",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
newspaw = "newspaw.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
